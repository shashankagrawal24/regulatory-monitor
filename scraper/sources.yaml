# =============================================================================
# Regulatory Monitor: source list
# =============================================================================
# To add a website, add one entry below. No code change is needed.
# Then run:  python scraper/monitor.py --check-sources --only YourSourceName
#
# Fields
#   name       unique id, shown in briefings and in data/feed_health.json
#   url        feed or page address
#   type       rss      (RSS or Atom feed, the default)
#              listing  (HTML page that lists items)
#   tier       official | tier1_news | tier2_news | blog
#   group      health bucket: SEBI, RBI, CBDT, IRDAI, PFRDA, AMFI, PIB, Exchanges,
#              NPS Trust, or News (default)
#   regulator  fixed label for every item. Leave out to detect it from the text.
#   lenient    true  = keep every item that is not noise (use for a regulator's own
#                      circular page, where everything is on-topic)
#              [a,b] = keep items whose title has one of these words, even if the
#                      main keyword filter says no
#   fulltext   false = never open the article page for this source
#   min_score  keyword score an item needs to get in (default 1). Use 3 for general
#              market or economy feeds, so only clearly on-topic stories pass.
#   max_keep   most items one source may add to a single briefing (default 10)
#   max_items  how many items to read from the top (default 40)
#   enabled    false = keep the entry but skip it
#
# Listing pages only
#   row        CSS selector for one item (a table row, a card)
#   link       CSS selector for the item's link. With no `row`, the scraper starts
#              from these links and looks around each one for a date.
#   title      CSS selector for the title (default: the best text in the row)
#   date       CSS selector for the date (default: first date found in the row)
#
# Sources with no date at all still work: an item is "new" when it was not on the
# page during an earlier run. The first run for such a source reports nothing.
# =============================================================================

settings:
  workers: 8                # sources scraped in parallel (one request per site at a time)
  briefing:
    max_news_items: 60      # news items in the daily brief. Official items are never cut.
                            # The rest stay in latest.json under "more_items".
  fulltext:
    enabled: true
    max_articles: 80        # article pages opened per run, highest relevance first
    workers: 6

sources:

